<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyRise — Student Productivity & Leaderboard</title>
    <script>
      try {
        var t = localStorage.getItem("studyrise-theme") || "dark";
        var el = document.documentElement;
        el.classList.add(t);
        el.style.colorScheme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
